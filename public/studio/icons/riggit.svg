<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Riggit">
  <title>Riggit</title>
  <desc>A hand sweeping backwards around a dial of contribution cells, the cells behind it brightening.</desc>

  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171D1A"/>
      <stop offset="1" stop-color="#0A0B0A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="115" fill="url(#tile)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="113.5" fill="none" stroke="#ffffff" stroke-opacity=".07" stroke-width="3"/>

  <!-- Contribution cells as dial markers. The hand rewinds anticlockwise from
       twelve, so the cell it has just finished, near eight, is the brightest
       and the trail falls away behind it back up to twelve. The cell at six is
       barely lit: the hand has not reached it yet. -->
  <g>
    <rect x="226"   y="61"    width="60" height="60" rx="16" fill="#1E4630"/>
    <rect x="109.3" y="109.3" width="60" height="60" rx="16" fill="#248055"/>
    <rect x="61"    y="226"   width="60" height="60" rx="16" fill="#2FAF77"/>
    <rect x="109.3" y="342.7" width="60" height="60" rx="16" fill="#3FD992"/>
    <rect x="226"   y="391"   width="60" height="60" rx="16" fill="#1A3A29"/>
    <rect x="342.7" y="342.7" width="60" height="60" rx="16" fill="#173324"/>
    <rect x="391"   y="226"   width="60" height="60" rx="16" fill="#173324"/>
    <rect x="342.7" y="109.3" width="60" height="60" rx="16" fill="#173324"/>
  </g>

  <!-- The hand, knocked out of the tile so it stays legible where it crosses
       a cell. The dark stroke is drawn first and slightly wider. -->
  <path d="M256 256 L154 322" fill="none" stroke="#0A0B0A" stroke-width="70" stroke-linecap="round"/>
  <path d="M256 256 L162 316" fill="none" stroke="#3FD992" stroke-width="40" stroke-linecap="round"/>

  <circle cx="256" cy="256" r="32" fill="#0A0B0A"/>
  <circle cx="256" cy="256" r="22" fill="#3FD992"/>
</svg>
